<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuukausibudjetin suunnittelutyökalu</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f6f8;
    padding:30px;
}

@media (max-width:600px){
    body{
        padding:15px;
    }
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    margin-bottom:25px;
    color:#333;
}

.layout{
    display:grid;
    grid-template-columns:320px 1fr;
    gap:25px;
}

.card{
    background:#fff;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

@media (max-width:600px){
    .card{
        padding:15px;
    }
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    margin-top:18px;
    padding:10px 18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#2563eb;
    color:white;
}

button:hover{
    background:#1d4ed8;
}

.delete{
    background:#dc2626;
}

.delete:hover{
    background:#b91c1c;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

th{
    background:#f3f4f6;
}

.summary{
    margin-top:25px;
    display:grid;
    gap:12px;
}

.summary div{
    padding:14px;
    border-radius:8px;
    font-size:18px;
    font-weight:bold;
}

.income{
    background:#dcfce7;
    color:#166534;
}

.bills{
    background:#dbeafe;
    color:#1d4ed8;
}

.left{
    background:#fee2e2;
    color:#991b1b;
}
@media (max-width:600px){

    button{
        width:100%;
    }

}
@media (max-width:600px){

    .summary div{
        font-size:16px;
        padding:12px;
    }

}
@media (max-width:700px){

table,
thead,
tbody,
th,
td,
tr{
    display:block;
}

thead{
    display:none;
}

tr{
    background:white;
    border:1px solid #ddd;
    border-radius:10px;
    margin-bottom:15px;
    padding:10px;
}

td{
    border:none;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 0;
}

td::before{
    font-weight:bold;
}

td:nth-child(1)::before{
    content:"Meno";
}

td:nth-child(2)::before{
    content:"Hinta";
}

td:nth-child(3)::before{
    content:"Tuloista";
}

td:nth-child(4)::before{
    content:"";
}

.delete{
    width:100%;
}

}
@media(max-width:900px){
    .layout{
        grid-template-columns:1fr;
    }
}
</style>
</head>
<body>

<div class="container">

<h1>Kuukausibudjetin suunnittelutyökalu</h1>

<div class="layout">



<div class="card">

<h2>Sinun palkkasi</h2>

<label>Kuukausittainen tulo</label>
<input
type="number"
id="income"
placeholder="Lisää kuukausitulosi"
oninput="updateSummary()">

<div class="summary">

<div class="income">
Tulot:
<span id="incomeDisplay">0.00</span>€
</div>

<div class="bills">
Laskut:
<span id="billDisplay">0.00</span>€
</div>

<div class="left">
Rahaa jäljellä:
<span id="leftDisplay">0.00</span>€
</div>

</div>

</div>



<div class="card">

<h2>Kuukausittaiset Menot</h2>

<label>Menon nimi</label>
<input id="utilityName" placeholder="Sähkö">

<label>Kuukausittainen maksu</label>
<input id="utilityCost" type="number" placeholder="125">

<button onclick="addUtility()">Lisää meno</button>

<table>

<thead>
<tr>
<th>Meno</th>
<th>Hinta</th>
<th>% Tuloista</th>
<th></th>
</tr>
</thead>

<tbody id="tableBody">

</tbody>

</table>

</div>

</div>

</div>

<script>

let utilities=[];

function addUtility(){

const name=document.getElementById("utilityName").value.trim();
const cost=parseFloat(document.getElementById("utilityCost").value);

if(name==="" || isNaN(cost)) return;

utilities.push({
    name,
    cost
});

document.getElementById("utilityName").value="";
document.getElementById("utilityCost").value="";

renderTable();

}

function removeUtility(index){
utilities.splice(index,1);
renderTable();
}

function renderTable(){

const tbody=document.getElementById("tableBody");
tbody.innerHTML="";

const income=parseFloat(document.getElementById("income").value)||0;

utilities.forEach((u,index)=>{

const percent=
income>0
?((u.cost/income)*100).toFixed(1)
:"0.0";

tbody.innerHTML+=`
<tr>
<td>${u.name}</td>
<td>€${u.cost.toFixed(2)}€</td>
<td>${percent}%</td>
<td>
<button class="delete"
onclick="removeUtility(${index})">
Delete
</button>
</td>
</tr>
`;

});

updateSummary();

}

function updateSummary(){

const income=parseFloat(document.getElementById("income").value)||0;

const totalBills=utilities.reduce((sum,u)=>sum+u.cost,0);

const left=income-totalBills;

document.getElementById("incomeDisplay").textContent=
income.toFixed(2);

document.getElementById("billDisplay").textContent=
totalBills.toFixed(2);

document.getElementById("leftDisplay").textContent=
left.toFixed(2);

renderPercentages();

}

function renderPercentages(){

const rows=document.querySelectorAll("#tableBody tr");
const income=parseFloat(document.getElementById("income").value)||0;

rows.forEach((row,index)=>{

const percentCell=row.children[2];

if(income===0){
percentCell.innerText="0.0%";
}else{
percentCell.innerText=
((utilities[index].cost/income)*100).toFixed(1)+"%";
}

});

}

</script>

</body>
</html>
